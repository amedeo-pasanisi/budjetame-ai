name: CD (prod)

# The only way prod is deployed: a human clicks "Run workflow" and picks the
# release tag. The gate step refuses tags whose images don't exist — i.e.
# tags that never went through cd-release.yml (the tag → stage pipeline) —
# so prod can only run an artifact stage has already run.
#
# Rollback: run this workflow again with the previous tag — compose just
# pulls the older images and the db_data volume carries over.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (vX.Y.Z — must have been verified on stage)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/amedeo-pasanisi/budjetame-ai
  ENV: ${{ inputs.tag }}
  DOMAIN: budjetame.de, www.budjetame.de

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  gate:
    name: Verify tag went through stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate tag format
        run: |
          if ! [[ "${{ env.ENV }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '${{ env.ENV }}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the release manifest exists
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }} \
            ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}
          echo "ok: ${{ env.ENV }} was built by cd-release.yml — stage ran this artifact"

  deploy-prod:
    name: Deploy to prod
    needs: gate
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Write .env from environment secrets
        run: |
          cat > .env <<'EOF'
          ENV=${{ env.ENV }}
          DOMAIN=${{ env.DOMAIN }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BUDJETAME_JWT_SECRET=${{ secrets.BUDJETAME_JWT_SECRET }}
          BUDJETAME_SEED_ACCOUNT_EMAIL=${{ secrets.BUDJETAME_SEED_ACCOUNT_EMAIL }}
          BUDJETAME_SEED_ACCOUNT_PASSWORD=${{ secrets.BUDJETAME_SEED_ACCOUNT_PASSWORD }}
          BUDJETAME_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.BUDJETAME_GOOGLE_OAUTH_CLIENT_ID }}
          BUDJETAME_SMTP_HOST=${{ secrets.BUDJETAME_SMTP_HOST }}
          BUDJETAME_SMTP_PORT=${{ secrets.BUDJETAME_SMTP_PORT }}
          BUDJETAME_SMTP_USER=${{ secrets.BUDJETAME_SMTP_USER }}
          BUDJETAME_SMTP_PASSWORD=${{ secrets.BUDJETAME_SMTP_PASSWORD }}
          BUDJETAME_SMTP_FROM=${{ secrets.BUDJETAME_SMTP_FROM }}
          BUDJETAME_SMTP_TLS=${{ secrets.BUDJETAME_SMTP_TLS }}
          EOF
          # Reset links must point at the public SPA (prod: the apex).
          DOMAIN_VALUE="${{ env.DOMAIN }}"
          printf 'BUDJETAME_PUBLIC_BASE_URL=https://%s\n' "${DOMAIN_VALUE%%,*}" >> .env
          scp -i ~/.ssh/deploy_key .env compose.deploy.yaml ubuntu@${{ secrets.VM_HOST }}:~/
      - name: Install Docker if missing
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'command -v docker >/dev/null || curl -fsSL https://get.docker.com | sudo sh'
      - name: Pull and start
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'mkdir -p budjetame && mv -f ~/.env ~/compose.deploy.yaml budjetame/ &&
           cd budjetame && sudo docker compose -f compose.deploy.yaml -p budjetame-ai pull &&
           sudo docker compose -f compose.deploy.yaml -p budjetame-ai up -d'
      - name: Health check
        run: |
          DOMAIN_PRIMARY="${DOMAIN%%,*}"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://$DOMAIN_PRIMARY/api/health" | grep -q '"ok"'; then
              echo "healthy: ${{ env.ENV }} at https://$DOMAIN_PRIMARY"
              exit 0
            fi
            sleep 5
          done
          echo "not healthy: ${{ env.ENV }} — check: ssh ubuntu@${{ secrets.VM_HOST }} 'cd budjetame && sudo docker compose -f compose.deploy.yaml logs -f'"
          exit 1
