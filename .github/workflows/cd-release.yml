name: CD (release → stage)

# A v* tag is a release candidate. Cutting one builds the exact artifact
# prod will run — same version tag, both platforms — and deploys it to
# stage. Deploying to prod is a separate, human-triggered workflow
# (cd-prod.yml), so stage is the hard gate: prod never sees an artifact
# stage hasn't run.
#
# If stage fails, fix on main and force-move the tag to the fixed commit
# (git tag -f vX.Y.Z <sha> && git push --force origin vX.Y.Z) — nothing has
# reached prod yet, so re-tagging is safe.

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/amedeo-pasanisi/budjetame-ai
  # The version tag IS the image tag: stage and prod both pull the same
  # ghcr.io/.../backend:vX.Y.Z manifest — the exact artifact stage verified.
  ENV: ${{ github.ref_name }}
  DOMAIN: stage.budjetame.de

concurrency:
  group: cd-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Each platform is built natively on its own runner (no QEMU emulation —
  # the frontend's npm/tsc/vite toolchain grinds for hours under it) and
  # pushed under a platform-suffixed tag. Pushing both platforms to the
  # same tag concurrently would race the manifest merge, so the `manifest`
  # job below assembles the combined :vX.Y.Z tag afterwards.
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          tags: ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }}-amd64
          push: true
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}-amd64
          push: true
          # Google Maps picker (issue #27): the key never touches the repo;
          # CI reads the GOOGLE_MAPS_API_KEY secret. Empty key → Leaflet.
          build-args: |
            VITE_MAP_PROVIDER=google
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          tags: ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }}-arm64
          push: true
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}-arm64
          push: true
          build-args: |
            VITE_MAP_PROVIDER=google
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

  manifest:
    name: Assemble multi-arch manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :vX.Y.Z manifest from both platform builds
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }} \
            ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }}-amd64 \
            ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }}-arm64
          docker buildx imagetools create \
            -t ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }} \
            ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}-amd64 \
            ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}-arm64

  deploy-stage:
    name: Deploy to stage
    needs: manifest
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Write .env from environment secrets
        run: |
          cat > .env <<'EOF'
          ENV=${{ env.ENV }}
          DOMAIN=${{ env.DOMAIN }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BUDJETAME_JWT_SECRET=${{ secrets.BUDJETAME_JWT_SECRET }}
          BUDJETAME_SEED_ACCOUNT_EMAIL=${{ secrets.BUDJETAME_SEED_ACCOUNT_EMAIL }}
          BUDJETAME_SEED_ACCOUNT_PASSWORD=${{ secrets.BUDJETAME_SEED_ACCOUNT_PASSWORD }}
          BUDJETAME_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.BUDJETAME_GOOGLE_OAUTH_CLIENT_ID }}
          BUDJETAME_SMTP_HOST=${{ secrets.BUDJETAME_SMTP_HOST }}
          BUDJETAME_SMTP_PORT=${{ secrets.BUDJETAME_SMTP_PORT }}
          BUDJETAME_SMTP_USER=${{ secrets.BUDJETAME_SMTP_USER }}
          BUDJETAME_SMTP_PASSWORD=${{ secrets.BUDJETAME_SMTP_PASSWORD }}
          BUDJETAME_SMTP_FROM=${{ secrets.BUDJETAME_SMTP_FROM }}
          BUDJETAME_SMTP_TLS=${{ secrets.BUDJETAME_SMTP_TLS }}
          EOF
          # Reset links must point at the public SPA.
          DOMAIN_VALUE="${{ env.DOMAIN }}"
          printf 'BUDJETAME_PUBLIC_BASE_URL=https://%s\n' "${DOMAIN_VALUE%%,*}" >> .env
          scp -i ~/.ssh/deploy_key .env compose.deploy.yaml ubuntu@${{ secrets.VM_HOST }}:~/
      - name: Install Docker if missing
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'command -v docker >/dev/null || curl -fsSL https://get.docker.com | sudo sh'
      - name: Pull and start
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'mkdir -p budjetame && mv -f ~/.env ~/compose.deploy.yaml budjetame/ &&
           cd budjetame && sudo docker compose -f compose.deploy.yaml -p budjetame-ai pull &&
           sudo docker compose -f compose.deploy.yaml -p budjetame-ai up -d'
      - name: Health check
        run: |
          DOMAIN_PRIMARY="${DOMAIN%%,*}"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://$DOMAIN_PRIMARY/api/health" | grep -q '"ok"'; then
              echo "healthy: ${{ env.ENV }} at https://$DOMAIN_PRIMARY"
              exit 0
            fi
            sleep 5
          done
          echo "not healthy: ${{ env.ENV }} — check: ssh ubuntu@${{ secrets.VM_HOST }} 'cd budjetame && sudo docker compose -f compose.deploy.yaml logs -f'"
          exit 1
