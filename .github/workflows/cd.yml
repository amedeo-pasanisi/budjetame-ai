name: CD (dev)

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/amedeo-pasanisi/budjetame-ai
  # dev is an iteration environment: a floating image tag, rebuilt on every
  # push. Releases (stage/prod) instead build version-tagged images — see
  # cd-release.yml and cd-prod.yml.
  ENV: dev
  # Hostname Caddy serves, written into .env and used by the health check.
  DOMAIN: dev.budjetame.de
  # dev runs on the free AMD64 E2.1.Micro — only that platform is built
  # (a multi-arch build would put the other half under QEMU emulation,
  # where the frontend's npm/tsc/vite toolchain grinds for hours).
  PLATFORMS: linux/amd64

concurrency:
  group: cd-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }}
          push: true
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}
          push: true
          # Google Maps picker (issue #27): the key never touches the repo;
          # CI reads the GOOGLE_MAPS_API_KEY secret. Empty key → Leaflet.
          build-args: |
            VITE_MAP_PROVIDER=google
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Write .env from environment secrets
        run: |
          cat > .env <<'EOF'
          ENV=${{ env.ENV }}
          DOMAIN=${{ env.DOMAIN }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BUDJETAME_JWT_SECRET=${{ secrets.BUDJETAME_JWT_SECRET }}
          BUDJETAME_ASSISTANT_KEY_SECRET=${{ secrets.BUDJETAME_ASSISTANT_KEY_SECRET }}
          BUDJETAME_SEED_ACCOUNT_EMAIL=${{ secrets.BUDJETAME_SEED_ACCOUNT_EMAIL }}
          BUDJETAME_SEED_ACCOUNT_PASSWORD=${{ secrets.BUDJETAME_SEED_ACCOUNT_PASSWORD }}
          BUDJETAME_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.BUDJETAME_GOOGLE_OAUTH_CLIENT_ID }}
          BUDJETAME_SMTP_HOST=${{ secrets.BUDJETAME_SMTP_HOST }}
          BUDJETAME_SMTP_PORT=${{ secrets.BUDJETAME_SMTP_PORT }}
          BUDJETAME_SMTP_USER=${{ secrets.BUDJETAME_SMTP_USER }}
          BUDJETAME_SMTP_PASSWORD=${{ secrets.BUDJETAME_SMTP_PASSWORD }}
          BUDJETAME_SMTP_FROM=${{ secrets.BUDJETAME_SMTP_FROM }}
          BUDJETAME_SMTP_TLS=${{ secrets.BUDJETAME_SMTP_TLS }}
          EOF
          # Reset links must point at the public SPA.
          DOMAIN_VALUE="${{ env.DOMAIN }}"
          printf 'BUDJETAME_PUBLIC_BASE_URL=https://%s\n' "${DOMAIN_VALUE%%,*}" >> .env
          scp -i ~/.ssh/deploy_key .env compose.deploy.yaml ubuntu@${{ secrets.VM_HOST }}:~/
      - name: Install Docker if missing
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'command -v docker >/dev/null || curl -fsSL https://get.docker.com | sudo sh'
      - name: Pull and start
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'mkdir -p budjetame && mv -f ~/.env ~/compose.deploy.yaml budjetame/ &&
           cd budjetame && sudo docker compose -f compose.deploy.yaml -p budjetame-ai pull &&
           sudo docker compose -f compose.deploy.yaml -p budjetame-ai up -d'
      - name: Health check
        run: |
          DOMAIN_PRIMARY="${DOMAIN%%,*}"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://$DOMAIN_PRIMARY/api/health" | grep -q '"ok"'; then
              echo "healthy: ${{ env.ENV }} at https://$DOMAIN_PRIMARY"
              exit 0
            fi
            sleep 5
          done
          echo "not healthy: ${{ env.ENV }} — check: ssh ubuntu@${{ secrets.VM_HOST }} 'cd budjetame && sudo docker compose -f compose.deploy.yaml logs -f'"
          exit 1
