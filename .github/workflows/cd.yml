name: CD

on:
  push:
    branches: [dev, stage, main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/amedeo-pasanisi/budjetame-ai
  # Branch → environment: main=prod, stage=stage, dev=dev.
  # Computed from github context so job-level keys can use it too.
  ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
  # Hostname(s) Caddy serves, per environment: prod gets the apex + www
  # (www redirects to the apex), dev/stage get their subdomain. Written into
  # .env and used by the health check below.
  DOMAIN: ${{ github.ref_name == 'main' && 'budjetame.it, www.budjetame.it' || format('{0}.budjetame.it', github.ref_name) }}
  # Each environment runs exactly one architecture: prod is ARM64
  # (A1.Flex), stage/dev are AMD64 (E2.1.Micro). Only that platform is
  # built — a multi-arch build would put the other half under QEMU
  # emulation, where the frontend's npm/tsc/vite toolchain grinds for
  # hours (and the emulated image could never run on that VM anyway).
  PLATFORMS: ${{ github.ref_name == 'main' && 'linux/arm64' || 'linux/amd64' }}

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build images
    # Native runner per environment: ubuntu-latest (AMD64) for dev/stage,
    # GitHub's free ARM64 runner for prod (public repos) — no QEMU anywhere.
    runs-on: ${{ github.ref_name == 'main' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_BASE }}/backend:${{ env.ENV }}
          push: true
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ env.ENV }}
          push: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Write .env from environment secrets
        run: |
          cat > .env <<'EOF'
          ENV=${{ env.ENV }}
          DOMAIN=${{ env.DOMAIN }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BUDJETAME_JWT_SECRET=${{ secrets.BUDJETAME_JWT_SECRET }}
          BUDJETAME_SEED_ACCOUNT_EMAIL=${{ secrets.BUDJETAME_SEED_ACCOUNT_EMAIL }}
          BUDJETAME_SEED_ACCOUNT_PASSWORD=${{ secrets.BUDJETAME_SEED_ACCOUNT_PASSWORD }}
          EOF
          scp -i ~/.ssh/deploy_key .env compose.deploy.yaml ubuntu@${{ secrets.VM_HOST }}:~/
      - name: Install Docker if missing
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'command -v docker >/dev/null || curl -fsSL https://get.docker.com | sudo sh'
      - name: Pull and start
        run: >
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.VM_HOST }}
          'mkdir -p budjetame && mv -f ~/.env ~/compose.deploy.yaml budjetame/ &&
           cd budjetame && sudo docker compose -f compose.deploy.yaml -p budjetame-ai pull &&
           sudo docker compose -f compose.deploy.yaml -p budjetame-ai up -d'
      - name: Health check
        run: |
          DOMAIN_PRIMARY="${DOMAIN%%,*}"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://$DOMAIN_PRIMARY/api/health" | grep -q '"ok"'; then
              echo "healthy: ${{ env.ENV }} at https://$DOMAIN_PRIMARY"
              exit 0
            fi
            sleep 5
          done
          echo "not healthy: ${{ env.ENV }} — check: ssh ubuntu@${{ secrets.VM_HOST }} 'cd budjetame && sudo docker compose -f compose.deploy.yaml logs -f'"
          exit 1
