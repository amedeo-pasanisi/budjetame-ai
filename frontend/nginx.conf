# Budjetame — single origin in production: nginx serves the built SPA and
# forwards /api/* to the backend container, stripping the prefix (the same
# contract as the Vite dev proxy). The browser never talks to the backend
# directly, so there is no CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths serve index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
