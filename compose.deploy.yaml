# CI/CD deployment compose — images come from GHCR, built by the CD
# workflows (.github/workflows/cd-*.yml). dev gets a floating `:dev` tag on
# every push; releases get a version tag (:vX.Y.Z) built by cd-release.yml
# and promoted to prod by hand via cd-prod.yml. The workflow writes .env
# from GitHub environment secrets, then runs:
#   docker compose -f compose.deploy.yaml -p budjetame-ai pull && up -d
# The project name matches the original prod stack so upgrades swap in place
# and the db_data volume (all your data) carries over.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budjetame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: budjetame
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budjetame -d budjetame"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/amedeo-pasanisi/budjetame-ai/backend:${ENV:?set in .env}
    restart: unless-stopped
    environment:
      BUDJETAME_DATABASE_URL: postgresql+psycopg://budjetame:${POSTGRES_PASSWORD:?}@db:5432/budjetame
      BUDJETAME_JWT_SECRET: ${BUDJETAME_JWT_SECRET:?set in .env}
      BUDJETAME_SEED_ACCOUNT_EMAIL: ${BUDJETAME_SEED_ACCOUNT_EMAIL:?set in .env}
      BUDJETAME_SEED_ACCOUNT_PASSWORD: ${BUDJETAME_SEED_ACCOUNT_PASSWORD:?set in .env}
      # Optional (issue #81): empty disables the Google button.
      BUDJETAME_GOOGLE_OAUTH_CLIENT_ID: ${BUDJETAME_GOOGLE_OAUTH_CLIENT_ID:-}
      # Email (issue #83): empty smtp_host = dev posture (reset emails are
      # logged, not sent). public_base_url is computed by the CD workflow.
      BUDJETAME_SMTP_HOST: ${BUDJETAME_SMTP_HOST:-}
      BUDJETAME_SMTP_PORT: ${BUDJETAME_SMTP_PORT:-}
      BUDJETAME_SMTP_USER: ${BUDJETAME_SMTP_USER:-}
      BUDJETAME_SMTP_PASSWORD: ${BUDJETAME_SMTP_PASSWORD:-}
      BUDJETAME_SMTP_FROM: ${BUDJETAME_SMTP_FROM:-}
      BUDJETAME_SMTP_TLS: ${BUDJETAME_SMTP_TLS:-}
      BUDJETAME_PUBLIC_BASE_URL: ${BUDJETAME_PUBLIC_BASE_URL:?set in .env}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/amedeo-pasanisi/budjetame-ai/frontend:${ENV:?set in .env}
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP → HTTPS redirect + ACME challenges
      - "443:443" # HTTPS (Caddy terminates TLS, Let's Encrypt)
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    # Caddy's data (certificates, ACME account) and config live on named
    # volumes, not the container layer: without them every redeploy recreates
    # the container with an empty cert store and re-provisions from scratch —
    # minutes of TLS-alert health-check failures, and Let's Encrypt rate
    # limits push Caddy to the ZeroSSL fallback (seen on the v1.1.0 prod
    # deploy). With the volumes, certs survive redeploys and Caddy renews
    # them itself (~60 days).
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:
